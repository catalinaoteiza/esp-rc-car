<!DOCTYPE html>
<html>
<head>
    <meta name="viewport"
          content="width=device-width,initial-scale=1.0,user-scalable=no">

    <meta charset="utf-8">

    <title>Mecanum Robot Control</title>

    <script src="./joy.js"></script>
    <script src="./script.js"></script>

    <style>

        html, body{
            margin:0;
            padding:0;
            width:100%;
            height:100%;
            overflow:hidden;
            background:#202020;
            touch-action:none;
        }

        #joyLeft{
            position:fixed;
            left:20px;
            bottom:20px;
            width:220px;
            height:220px;
        }

        #joyRight{
            position:fixed;
            right:20px;
            bottom:20px;
            width:220px;
            height:220px;
        }

        #status{
            position:fixed;
            top:10px;
            left:10px;
            color:white;
            font-family:monospace;
            font-size:14px;
        }

    </style>

</head>

<body>

    <div id="status">
        FWD: <span id="fwd">0</span><br>
        STRAFE: <span id="strafe">0</span><br>
        ROT: <span id="rot">0</span>
    </div>

    <div id="joyLeft"></div>
    <div id="joyRight"></div>

<script>

// Stick izquierdo:
// Y = adelante/atrás
// X = strafe

const joyLeft = new JoyStick(
    "joyLeft",
    {
        title:"joyLeft"
    }
);

// Stick derecho:
// X = rotación

const joyRight = new JoyStick(
    "joyRight",
    {
        title:"joyRight"
    }
);

const fwdLabel = document.getElementById("fwd");
const strafeLabel = document.getElementById("strafe");
const rotLabel = document.getElementById("rot");

function sendControl()
{
    let forward = -parseInt(joyLeft.GetY());
    let strafe  =  parseInt(joyLeft.GetX());
    let rotate  =  parseInt(joyRight.GetX());

    fwdLabel.innerText = forward;
    strafeLabel.innerText = strafe;
    rotLabel.innerText = rotate;

    send(
        forward +
        "," +
        strafe +
        "," +
        rotate
    );
}

setInterval(sendControl, 50);

</script>

</body>
</html>
