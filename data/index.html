<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
    <meta charset="utf-8" />

    <link rel="stylesheet" type="text/css" href="./style.css">

    <script src="./joy.js"></script>
    <script src="./script.js"></script>

    <title>Mecanum Robot Control</title>
</head>

<body>
    <div id="topBar">

        <button id="stopBtn">
            STOP
        </button>

        <div id="status">
            DISCONNECTED
        </div>

        <button id="enableBtn">
            ENABLED: OFF
        </button>

        <button id="configBtn">⚙️</button>


    </div>
    
    <div id="servoRow">

        <div class="servoContainer">

            <label>Servo Izq</label>


            <div id="servoLeftTrack">
                <div id="servoLeftKnob"></div>
            </div>

            <span id="servoLeftValue">90°</span>

        </div>

        <div class="servoContainer">

            <label>Servo Der</label>

            <div id="servoRightTrack">
                <div id="servoRightKnob"></div>
            </div>

            <span id="servoRightValue">90°</span>

        </div>

    </div>

    <div id="outerContainer">

        <div id="joyLeft"></div>

        <div id="joyRight"></div>

    </div>


<div id="configPanel" class="hidden">

    <h3>Configuración</h3>

    <label>
        <input type="checkbox" id="invertForward">
        Invertir Adelante/Atrás
    </label>

    <label>
        <input type="checkbox" id="invertStrafe">
        Invertir Izquierda/Derecha
    </label>

    <label>
        <input type="checkbox" id="invertRotate">
        Invertir Giro
    </label>

</div>


</body>
</html>
