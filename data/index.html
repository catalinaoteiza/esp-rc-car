<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
    <meta charset="utf-8" />

    <link rel="stylesheet" type="text/css" href="./style.css">

    <script src="./joy.js"></script>
    <script src="./script.js"></script>

    <title>Mecanum Robot Control</title>
</head>

<body>
    <div id="topBar">

        <button id="stopBtn">
            STOP
        </button>

        <div id="status">
            DISCONNECTED
        </div>

        <button id="enableBtn">
            ENABLED: OFF
        </button>

    </div>
    
    <div id="servoRow">

        <div class="servoContainer">

            <label>Servo Izq</label>

            <input
                class="servoSlider"
                type="range"
                id="servoLeft"
                min="0"
                max="180"
                value="90">

            <span id="servoLeftValue">90°</span>

        </div>

        <div class="servoContainer">

            <label>Servo Der</label>

            <input
                class="servoSlider"
                type="range"
                id="servoRight"
                min="0"
                max="180"
                value="90">

            <span id="servoRightValue">90°</span>

        </div>

    </div>

    <div id="outerContainer">

        <div id="joyLeft"></div>

        <div id="joyRight"></div>

    </div>

<script>

    // =========================
    // JOYSTICKS
    // =========================

    var JoyLeft = new JoyStick('joyLeft', {});

    var JoyRight = new JoyStick('joyRight', {
        title: 'joystick2'
    });

    // =========================
    // HELPERS
    // =========================

    function deadzone(value)
    {
        return Math.abs(value) < 10 ? 0 : value;
    }

    function getControlData()
    {
        // Stick izquierdo
        let leftX  = Number(JoyLeft.GetX());
        let leftY  = Number(JoyLeft.GetY());
        
        // Stick derecho
        let rightX = Number(JoyRight.GetX());
        let rightY = Number(JoyRight.GetY());

        let forward = deadzone(-leftY);
        let strafe  = deadzone(leftX);

        let rotate  = deadzone(rightX);
        let aux     = deadzone(-rightY);        


        if(!enabled)
        {
            forward = 0;
            strafe = 0;
            rotate = 0;
            aux = 0; 
        }

        return (
            forward +
            "," +
            strafe +
            "," +
            rotate +
            "," +
            servoLeftPos +
            "," +
            servoRightPos
        );
    }

    // =========================
    // WEBSOCKET TX
    // =========================

    let lastPacket = "";

    setInterval(() =>
    {
        let packet = getControlData();

        if(packet !== lastPacket)
        {
            console.log(packet);

            send(packet);

            lastPacket = packet;
        }

    }, 50);

</script>

<script>
document.addEventListener(
    "touchmove",
    function(e)
    {
        if (
            e.target.closest("#joyLeft") ||
            e.target.closest("#joyRight")
        )
        {
            e.preventDefault();
        }
    },
    { passive: false }
);
</script>

<script>
let enabled = false;

document
.getElementById("enableBtn")
.onclick = () =>
{
    enabled = !enabled;

    document.getElementById("enableBtn").textContent =
        enabled
        ? "ENABLED: ON"
        : "ENABLED: OFF";
};

let servoLeftPos = 90;
let servoRightPos = 90;

const sliderLeft =
    document.getElementById("servoLeft");

const sliderRight =
    document.getElementById("servoRight");

sliderLeft.oninput = () =>
{
    servoLeftPos = Number(sliderLeft.value);

    document.getElementById("servoLeftValue")
        .textContent = servoLeftPos + "°";
};

sliderRight.oninput = () =>
{
    servoRightPos = Number(sliderRight.value);

    document.getElementById("servoRightValue")
        .textContent = servoRightPos + "°";
};

ws.onopen = () =>
{
    document.getElementById("status")
        .textContent = "CONNECTED";
};

ws.onclose = () =>
{
    document.getElementById("status")
        .textContent = "DISCONNECTED";
};

document
.getElementById("stopBtn")
.onclick = () =>
{
    send("0,0,0,90");
    enabled = false;
};

</script>

</body>
</html>
