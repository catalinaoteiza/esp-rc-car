<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
    <meta charset="utf-8" />

    <link rel="stylesheet" type="text/css" href="./style.css">

    <script src="./joy.js"></script>
    <script src="./script.js"></script>

    <title>Mecanum Robot Control</title>
</head>

<body>

    <div id="outerContainer">

        <div id="joyLeft"></div>

        <div id="joyRight"></div>

    </div>

<script>

    // =========================
    // JOYSTICKS
    // =========================

    var JoyLeft = new JoyStick('joyLeft', {});

    var JoyRight = new JoyStick('joyRight', {
        title: 'joystick2'
    });

    // =========================
    // HELPERS
    // =========================

    function deadzone(value)
    {
        return Math.abs(value) < 10 ? 0 : value;
    }

    function getControlData()
    {
        // Stick izquierdo
        let leftX  = Number(JoyLeft.GetX());
        let leftY  = Number(JoyLeft.GetY());
        
        // Stick derecho
        let rightX = Number(JoyRight.GetX());
        let rightY = Number(JoyRight.GetY());

        let forward = deadzone(-leftY);
        let strafe  = deadzone(leftX);

        let rotate  = deadzone(rightX);
        let aux     = deadzone(-rightY);        

        return (
            forward +
            "," +
            strafe +
            "," +
            rotate +
            "," +
            aux
        );
    }

    // =========================
    // WEBSOCKET TX
    // =========================

    let lastPacket = "";

    setInterval(() =>
    {
        let packet = getControlData();

        if(packet !== lastPacket)
        {
            console.log(packet);

            send(packet);

            lastPacket = packet;
        }

    }, 50);

</script>

<script>
document.addEventListener(
    "touchmove",
    function(e) {
        e.preventDefault();
    },
    { passive: false }
);
</script>


</body>
</html>
