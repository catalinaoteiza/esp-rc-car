[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

upload_protocol = espota
upload_port = 192.168.4.1

;upload_protocol = esptool

monitor_speed = 115200
lib_deps =
    me-no-dev/ESPAsyncTCP
    me-no-dev/espasyncwebserver
    gilmaimon/ArduinoWebsockets